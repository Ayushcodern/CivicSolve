server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: civicsolve-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:civicsolve}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: CivicSolveHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

# ── Application Specific Configuration ────────────────────────
application:
  jwt:
    secret: ${JWT_SECRET:civicsolve_super_secret_jwt_key_2026_at_least_256_bits_long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: 5000

# ── Actuator Health Check ─────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
